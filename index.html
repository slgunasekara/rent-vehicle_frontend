<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef2f8" />
    <meta name="description" content="Vehicle Buddy - rent cars, SUVs, vans, buses, lorries and more from owners all over Sri Lanka. Call the owner directly. No middleman, no commission." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('fv_theme');
          if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          var l = localStorage.getItem('fv_lang');
          if (l) document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
    <title>Vehicle Buddy - Rent Vehicles in Sri Lanka</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
